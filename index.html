<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>afterglow archive</title>
  <style>
    :root {
      --bg: #11110f;
      --text: #f1ede4;
      --muted: #9c978d;
      --card: #181815;
      --border: #2a2924;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .wrap {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0;
    }

    header {
      margin-bottom: 48px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 7vw, 4.5rem);
      font-weight: 500;
      letter-spacing: -0.04em;
      text-transform: lowercase;
    }

    .tagline {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 22px;
    }

    .card {
      display: block;
      color: inherit;
      text-decoration: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: transform .2s ease, border-color .2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #4b4941;
    }

    .card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
    }

    .card-copy {
      padding: 16px;
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 1.1rem;
      font-weight: 500;
      text-transform: lowercase;
    }

    .meta {
      margin: 0;
      color: var(--muted);
      font-size: .9rem;
      line-height: 1.4;
    }

    footer {
      margin-top: 56px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: .9rem;
    }

    footer a {
      color: var(--text);
      text-decoration: none;
      margin-right: 16px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>afterglow archive</h1>
      <p class="tagline">
        old records for places, hours and memories.<br>
        50s–90s.
      </p>
    </header>

    <section class="grid">

      <a class="card"
         href="https://open.spotify.com/playlist/5N1O8NvqeExdXaHWp2F4c2?si=kDGyl6YnR16p2qr14qwqNA"
         target="_blank"
         rel="noopener">
        <img src="last-warm-light.jpg" alt="the last warm light">
        <div class="card-copy">
          <h2>the last warm light</h2>
          <p class="meta">
            1958–1995 · dusk · folk / soul / ambient
          </p>
        </div>
      </a>

    </section>

    <footer>
      <a href="PASTE_TIKTOK_LINK">TikTok</a>
      <a href="PASTE_INSTAGRAM_LINK">Instagram</a>
      <a href="PASTE_YOUTUBE_LINK">YouTube</a>
    </footer>
  </main>
</body>
</html>w
